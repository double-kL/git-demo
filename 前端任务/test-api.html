<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API测试工具</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #f5f5f4;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        h1 { color: #6b7280; }
        button {
            background: #6b7280;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover { background: #4b5563; }
        .result {
            background: #f5f5f4;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .success { border-left: 4px solid #6b9080; }
        .error { border-left: 4px solid #a8736f; }
        input {
            padding: 8px;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 API测试工具</h1>
        <p>用于诊断前后端连接问题</p>

        <h2>1. 测试后端健康状态</h2>
        <button onclick="testHealth()">测试 /api/health</button>
        <div id="health-result"></div>

        <h2>2. 测试注册</h2>
        <input type="text" id="reg-phone" placeholder="手机号" value="13900000001">
        <input type="text" id="reg-nickname" placeholder="昵称" value="测试用户">
        <input type="password" id="reg-password" placeholder="密码" value="123456">
        <button onclick="testRegister()">注册</button>
        <div id="register-result"></div>

        <h2>3. 测试登录</h2>
        <input type="text" id="login-phone" placeholder="手机号" value="13800138000">
        <input type="password" id="login-password" placeholder="密码" value="123456">
        <button onclick="testLogin()">登录</button>
        <div id="login-result"></div>

        <h2>4. 测试获取动态（需先登录）</h2>
        <button onclick="testGetPosts()">获取动态列表</button>
        <div id="posts-result"></div>

        <h2>5. 查看LocalStorage</h2>
        <button onclick="showLocalStorage()">查看存储的Token</button>
        <button onclick="clearLocalStorage()">清除LocalStorage</button>
        <div id="storage-result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let currentToken = null;

        function showResult(elementId, data, success = true) {
            const el = document.getElementById(elementId);
            el.className = 'result ' + (success ? 'success' : 'error');
            el.textContent = JSON.stringify(data, null, 2);
        }

        async function testHealth() {
            try {
                const response = await fetch(`${API_BASE}/api/health`);
                const data = await response.json();
                showResult('health-result', {
                    status: response.status,
                    data: data
                }, response.ok);
            } catch (error) {
                showResult('health-result', {
                    error: error.message,
                    tip: '后端未启动或端口不是8000'
                }, false);
            }
        }

        async function testRegister() {
            const phone = document.getElementById('reg-phone').value;
            const nickname = document.getElementById('reg-nickname').value;
            const password = document.getElementById('reg-password').value;

            try {
                const response = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, nickname, password })
                });
                const data = await response.json();

                if (response.ok && data.token) {
                    currentToken = data.token;
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                }

                showResult('register-result', {
                    status: response.status,
                    data: data,
                    token: data.token || null
                }, response.ok);
            } catch (error) {
                showResult('register-result', { error: error.message }, false);
            }
        }

        async function testLogin() {
            const phone = document.getElementById('login-phone').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });
                const data = await response.json();

                if (response.ok && data.token) {
                    currentToken = data.token;
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                }

                showResult('login-result', {
                    status: response.status,
                    data: data,
                    token: data.token || null,
                    savedToLocalStorage: response.ok
                }, response.ok);
            } catch (error) {
                showResult('login-result', { error: error.message }, false);
            }
        }

        async function testGetPosts() {
            const token = currentToken || localStorage.getItem('token');

            if (!token) {
                showResult('posts-result', {
                    error: '请先登录',
                    tip: '点击上方"登录"按钮先登录'
                }, false);
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/posts`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();

                showResult('posts-result', {
                    status: response.status,
                    usedToken: token,
                    data: data
                }, response.ok);
            } catch (error) {
                showResult('posts-result', { error: error.message }, false);
            }
        }

        function showLocalStorage() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');

            showResult('storage-result', {
                token: token,
                user: user ? JSON.parse(user) : null,
                tip: token ? 'Token已存储' : 'Token未存储'
            }, !!token);
        }

        function clearLocalStorage() {
            localStorage.clear();
            currentToken = null;
            showResult('storage-result', {
                message: 'LocalStorage已清除',
                tip: '现在可以重新测试登录'
            }, true);
        }

        // 页面加载时检查
        window.onload = function() {
            const token = localStorage.getItem('token');
            if (token) {
                currentToken = token;
                console.log('检测到已保存的Token:', token);
            }
        };
    </script>
</body>
</html>
